# Daily sync of upstream LibreChat-AI/code-interpreter into bu/main.
#
# bu/main is upstream main plus the BU changes that make the service run on
# EKS. This workflow keeps the upstream half fresh without touching the BU
# half: it merges upstream into a throwaway branch and opens a pull request.
# It never pushes to bu/main.
#
# Merging the PR is a human decision on purpose. Upstream regularly changes
# the Dockerfiles, the sandbox API and the service entrypoints — the exact
# files the BU changes sit in — so an auto-merge would silently rewrite
# security-relevant code (NsJail flags, the egress forward target, the package
# layout) between one night and the next.
#
# On a conflicting merge it does not push a half-merged tree. It aborts and
# files one issue naming the conflicting paths, updating that same issue on
# later runs so a long-lived conflict does not produce a daily pile of
# duplicates.
#
# Nothing BU-specific belongs in this file: it references only public
# repositories and uses only the built-in GITHUB_TOKEN. Image builds, ECR and
# anything else needing AWS live in the private assets repository.

name: Sync upstream

on:
  # ---------------------------------------------------------------------------
  # The daily schedule is OFF. Uncomment the two lines below to turn it on.
  #
  # 07:10 UTC is early morning ET, so a conflict is waiting at the start of the
  # working day rather than arriving mid-afternoon.
  #
  # Two things also have to be true before a schedule fires at all:
  #   * this file must be on the repository's DEFAULT branch — GitHub reads
  #     `schedule` and `workflow_dispatch` only from there, so a workflow that
  #     lives solely on bu/main never runs on a timer and never shows up in the
  #     Actions tab to dispatch;
  #   * the repository must have had activity in the last 60 days, after which
  #     GitHub suspends scheduled workflows until someone re-enables them.
  #
  # schedule:
  #   - cron: '10 7 * * *'
  # ---------------------------------------------------------------------------
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/LibreChat-AI/code-interpreter.git
  UPSTREAM_BRANCH: main
  BASE_BRANCH: bu/main
  SYNC_BRANCH: sync/upstream-main
  CONFLICT_ISSUE_TITLE: 'Upstream sync conflict (LibreChat-AI/code-interpreter)'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Literal, not ${{ env.BASE_BRANCH }} — checkout resolves `with`
          # before the job env is guaranteed, and a wrong ref here would sync
          # into the wrong branch silently.
          ref: bu/main
          # Full history: a shallow clone has no merge base with upstream, so
          # every merge would look like an unrelated-histories conflict.
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Fetch upstream
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null || \
            git remote set-url upstream "$UPSTREAM_REPO"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

      - name: Check whether anything is new
        id: check
        run: |
          set -euo pipefail
          # Commits on upstream that bu/main does not already contain.
          BEHIND=$(git rev-list --count "HEAD..upstream/${UPSTREAM_BRANCH}")
          echo "behind=${BEHIND}" >> "$GITHUB_OUTPUT"
          echo "bu/main is ${BEHIND} commit(s) behind upstream/${UPSTREAM_BRANCH}."
          if [ "$BEHIND" -eq 0 ]; then
            echo 'Nothing to sync.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Merge upstream into the sync branch
        id: merge
        if: steps.check.outputs.behind != '0'
        run: |
          set -euo pipefail
          git switch -c "$SYNC_BRANCH"

          if git merge --no-edit --no-ff \
               -m "chore(sync): merge upstream/${UPSTREAM_BRANCH} into ${BASE_BRANCH}" \
               "upstream/${UPSTREAM_BRANCH}"; then
            echo 'conflicted=false' >> "$GITHUB_OUTPUT"
          else
            # Capture the paths before aborting; afterwards they are gone.
            git diff --name-only --diff-filter=U | sort > /tmp/conflicts.txt
            git merge --abort
            echo 'conflicted=true' >> "$GITHUB_OUTPUT"
            echo 'Merge conflicts in:'
            cat /tmp/conflicts.txt
          fi

      # ----------------------------------------------------------------------
      # Clean merge: push the branch and open (or refresh) a PR into bu/main.
      # ----------------------------------------------------------------------
      - name: Push sync branch
        if: steps.merge.outputs.conflicted == 'false'
        # Plain --force is correct here: the branch is created and owned
        # entirely by this workflow and is disposable. --force-with-lease would
        # refuse on the first run, when no remote-tracking ref exists yet.
        run: git push --force origin "$SYNC_BRANCH"

      - name: Open PR into bu/main
        if: steps.merge.outputs.conflicted == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Build the body in a file. Nesting heredocs inside --body "$(...)"
          # works but is easy to break on the next edit.
          {
            echo "Automated daily sync of [LibreChat-AI/code-interpreter@${UPSTREAM_BRANCH}](https://github.com/LibreChat-AI/code-interpreter/tree/${UPSTREAM_BRANCH})."
            echo
            echo 'The merge applied cleanly, which means git found no textual conflict —'
            echo 'it does **not** mean the BU EKS changes still behave correctly.'
            echo 'Check these before merging:'
            echo
            echo '- `docker/Dockerfile.worker-sandbox` and `docker/start-direct-sandbox.sh` —'
            echo '  these are held byte-identical to upstream ON PURPOSE, so BU images never'
            echo '  build from them. If this sync changes either one, port the change by hand'
            echo '  into `docker/Dockerfile.bu-sandbox` / `docker/start-direct-sandbox-bu.sh`,'
            echo '  which is where the `worker-sandbox-kvm`, `worker-sandbox-nokvm` and'
            echo '  `sandbox-lambda-microvm` stages and the aarch64 library-path handling live.'
            echo '- `api/` and `api/config/sandbox.cfg` — NsJail flags and per-execution limits.'
            echo '- `launcher/entrypoint.sh` — boot-time resolution of the egress forward target.'
            echo '- `docker/package-init.sh` and `javascript-packages.txt` — runtime versions'
            echo '  and the `/pkgs` layout.'
            echo
            echo 'Upstream commits included:'
            echo
            echo '```'
            git log --no-merges --pretty='%h %s' \
              "${BASE_BRANCH}..upstream/${UPSTREAM_BRANCH}" | head -50
            echo '```'
          } > /tmp/pr-body.md

          OPEN=$(gh pr list --head "$SYNC_BRANCH" --base "$BASE_BRANCH" \
                   --state open --json number --jq length)
          if [ "$OPEN" -gt 0 ]; then
            echo 'PR already open; the force-push above refreshed it.'
            exit 0
          fi

          gh pr create \
            --head "$SYNC_BRANCH" --base "$BASE_BRANCH" \
            --title "chore(sync): upstream LibreChat-AI/code-interpreter into ${BASE_BRANCH}" \
            --body-file /tmp/pr-body.md

      # ----------------------------------------------------------------------
      # Conflicting merge: no branch, no PR. One issue, kept up to date.
      # ----------------------------------------------------------------------
      - name: File or update the conflict issue
        if: steps.merge.outputs.conflicted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          {
            echo "Merging \`upstream/${UPSTREAM_BRANCH}\` into \`${BASE_BRANCH}\` conflicts, so no"
            echo 'sync branch was pushed. Resolve it locally:'
            echo
            echo '```bash'
            echo "git fetch origin ${BASE_BRANCH}"
            echo "git switch -c ${SYNC_BRANCH} origin/${BASE_BRANCH}"
            echo "git remote add upstream ${UPSTREAM_REPO}   # if missing"
            echo "git fetch --no-tags upstream ${UPSTREAM_BRANCH}"
            echo "git merge upstream/${UPSTREAM_BRANCH}"
            echo '# resolve, keeping the BU EKS behaviour intact'
            echo "git push origin ${SYNC_BRANCH}"
            echo "gh pr create --head ${SYNC_BRANCH} --base ${BASE_BRANCH}"
            echo '```'
            echo
            echo 'Conflicting paths:'
            echo
            echo '```'
            cat /tmp/conflicts.txt
            echo '```'
            echo
            echo "Last checked: $(date -u +%Y-%m-%dT%H:%M:%SZ) — run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/issue-body.md

          # Match on exact title over the open-issue list rather than through
          # `--search`: the code search index lags by minutes, which on a daily
          # schedule is enough to open a duplicate.
          EXISTING=$(gh issue list --state open --limit 100 --json number,title \
                       --jq "[.[] | select(.title == env.CONFLICT_ISSUE_TITLE)] | .[0].number // empty")

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file /tmp/issue-body.md
            echo "Updated issue #${EXISTING}."
          else
            gh issue create --title "$CONFLICT_ISSUE_TITLE" --body-file /tmp/issue-body.md
          fi

          # Fail the run so the conflict also shows in the Actions tab.
          exit 1

      - name: Close a stale conflict issue
        if: steps.merge.outputs.conflicted == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --state open --limit 100 --json number,title \
                       --jq "[.[] | select(.title == env.CONFLICT_ISSUE_TITLE)] | .[0].number // empty")
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" \
              --comment 'Upstream now merges cleanly; a sync PR has been opened.'
          fi
